<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Content</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Google Sans', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #333; margin-bottom: 10px; font-size: 1.8em; }
        p { color: #666; margin-bottom: 30px; }
        input[type="password"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        input[type="password"]:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .error { color: #e74c3c; margin-top: 15px; display: none; }
        .loading { display: none; margin-top: 15px; color: #666; }
        .hint {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            color: #3d2a6b;
            font-size: 0.98em;
            font-weight: 500;
            text-align: left;
            font-style: normal;
            line-height: 1.5;
            margin: 0 0 24px;
            padding: 14px 16px;
            background: linear-gradient(135deg, #f4f0ff 0%, #faeeff 100%);
            border: 1px solid #d9ccff;
            border-left: 4px solid #764ba2;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(118, 75, 162, 0.08);
        }
        .hint .hint-icon { font-size: 1.25em; line-height: 1.2; flex-shrink: 0; }
        .hint strong { color: #4a2d8a; font-weight: 600; }
    </style>
</head>

        // The canonical password used for encryption is "haotian wang"
        // (lowercase, one space between given- and family-name).  We accept
        // any case, either name order, and the single space-between-names
        // as optional — but nothing else.  Leading/trailing whitespace,
        // double spaces, or extra characters all reject before we try to
        // decrypt.  All accepted forms collapse to the canonical key.
        function normalizePassword(raw) {
            if (raw !== raw.trim()) return null;          // no surrounding ws
            const lower = raw.toLowerCase();
            const valid = {
                'haotian wang': 1, 'wang haotian': 1,
                'haotianwang':  1, 'wanghaotian':  1,
            };
            if (!valid[lower]) return null;
            return 'haotian wang';
        }
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const raw = document.getElementById('password').value;
            const errorEl = document.getElementById('error');
            const loadingEl = document.getElementById('loading');
            errorEl.style.display = 'none';
            loadingEl.style.display = 'block';
            const normalized = normalizePassword(raw);
            if (!normalized) {
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
                return;
            }
            setTimeout(() => {
                try {
                    const decrypted = decryptContent(normalized);
                    if (decrypted) {
                        document.open();
                        document.write(decrypted);
                        document.close();
                    } else { throw new Error('Decryption failed'); }
                } catch (err) {
                    loadingEl.style.display = 'none';
                    errorEl.style.display = 'block';
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            }, 100);
        });
        function decryptContent(password) {

                const iv = CryptoJS.enc.Base64.parse(encryptedData.iv);
                const ciphertext = CryptoJS.enc.Base64.parse(encryptedData.data);
                const key = CryptoJS.PBKDF2(password.toLowerCase(), salt, { keySize: 256/32, iterations: 100000, hasher: CryptoJS.algo.SHA256 });
                const decrypted = CryptoJS.AES.decrypt({ ciphertext: ciphertext }, key, { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
                const plaintext = decrypted.toString(CryptoJS.enc.Utf8);
                if (!plaintext || plaintext.length === 0) { return null; }
                return plaintext;
            } catch (e) { return null; }
